<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Vibrant 3D Cyan-to-Cobalt Gradient -->
    <linearGradient id="coreGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="45%" stop-color="#0099ff" />
      <stop offset="85%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glass Specular Bevel -->
    <linearGradient id="specularGlow1" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing Synaptic Core Radial -->
    <radialGradient id="neuralAura1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbGlow1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </radialGradient>

    <filter id="shadow3D1" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0284c7" flood-opacity="0.45" />
    </filter>

    <filter id="bloomGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 3D Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#coreGrad1)" filter="url(#shadow3D1)" />

  <!-- Inner 3D Glass Specular Highlight -->
  <rect x="26" y="26" width="460" height="460" rx="114" fill="none" stroke="url(#specularGlow1)" stroke-width="4" />

  <!-- Outer Quantum Orbital Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="12 16" opacity="0.45" />
  <circle cx="256" cy="256" r="125" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 12" opacity="0.3" />

  <!-- Neural Halo Atmosphere -->
  <circle cx="256" cy="256" r="140" fill="url(#neuralAura1)" />

  <!-- Radiating Synaptic Axons -->
  <g stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" filter="url(#bloomGlow1)">
    <!-- Top-Left to Center -->
    <line x1="140" y1="165" x2="256" y2="256" />
    <!-- Top-Right to Center -->
    <line x1="372" y1="165" x2="256" y2="256" />
    <!-- Bottom-Left to Center -->
    <line x1="150" y1="350" x2="256" y2="256" />
    <!-- Bottom-Right to Center -->
    <line x1="362" y1="350" x2="256" y2="256" />
    <!-- Vertical Spine Accent -->
    <line x1="256" y1="130" x2="256" y2="256" stroke-width="16" opacity="0.8" />
  </g>

  <!-- 5 Orbital Satellite Nodes -->
  <g filter="url(#bloomGlow1)">
    <circle cx="140" cy="165" r="28" fill="url(#orbGlow1)" stroke="#ffffff" stroke-width="4" />
    <circle cx="372" cy="165" r="28" fill="url(#orbGlow1)" stroke="#ffffff" stroke-width="4" />
    <circle cx="150" cy="350" r="28" fill="url(#orbGlow1)" stroke="#ffffff" stroke-width="4" />
    <circle cx="362" cy="350" r="28" fill="url(#orbGlow1)" stroke="#ffffff" stroke-width="4" />
    <circle cx="256" cy="130" r="20" fill="url(#orbGlow1)" stroke="#ffffff" stroke-width="3.5" />
  </g>

  <!-- Central Super-Core Neural Node (3D Layered Orb) -->
  <circle cx="256" cy="256" r="60" fill="#ffffff" filter="url(#bloomGlow1)" />
  <circle cx="256" cy="256" r="44" fill="url(#coreGrad1)" />
  <circle cx="256" cy="256" r="24" fill="#ffffff" />
  <circle cx="248" cy="248" r="8" fill="#ffffff" opacity="0.8" />
</svg>