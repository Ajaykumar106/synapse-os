<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Vibrant 3D Cyan-to-Royal-Blue Gradient -->
    <linearGradient id="synapse3DGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="30%" stop-color="#00c6ff" />
      <stop offset="70%" stop-color="#0072ff" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Specular Highlight for 3D Glass Depth -->
    <linearGradient id="specularGlow" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Inner Core Radial Glow -->
    <radialGradient id="neuralHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0072ff" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Drop Shadow Filter -->
    <filter id="shadow3D" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0072ff" flood-opacity="0.45" />
    </filter>

    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 3D Squircle Base with Vibrant Blue Gradient -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#synapse3DGrad)" filter="url(#shadow3D)" />

  <!-- Inner 3D Highlight Bevel -->
  <rect x="22" y="22" width="468" height="468" rx="110" fill="none" stroke="url(#specularGlow)" stroke-width="4" />

  <!-- Radial Neural Halo Behind Central Core -->
  <circle cx="256" cy="256" r="170" fill="url(#neuralHalo)" />

  <!-- Orbit Connection Rings (Subtle Geometric Precision) -->
  <circle cx="256" cy="256" r="156" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="10 14" opacity="0.3" />

  <!-- Radiating Synaptic Axon Connectors -->
  <g stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.96" filter="url(#nodeGlow)">
    <!-- Top-Left to Center Core -->
    <line x1="126" y1="172" x2="224" y2="236" />
    <!-- Top-Right to Center Core -->
    <line x1="386" y1="172" x2="288" y2="236" />
    <!-- Bottom-Left to Center Core -->
    <line x1="126" y1="340" x2="224" y2="276" />
    <!-- Bottom-Right to Center Core -->
    <line x1="386" y1="340" x2="288" y2="276" />
  </g>

  <!-- 4 Orbital Satellite Nodes -->
  <g fill="#ffffff" filter="url(#nodeGlow)">
    <circle cx="106" cy="160" r="32" />
    <circle cx="406" cy="160" r="32" />
    <circle cx="106" cy="352" r="32" />
    <circle cx="406" cy="352" r="32" />
  </g>

  <!-- Orbital Node Inner Specular Accent -->
  <g fill="url(#synapse3DGrad)">
    <circle cx="106" cy="160" r="14" />
    <circle cx="406" cy="160" r="14" />
    <circle cx="106" cy="352" r="14" />
    <circle cx="406" cy="352" r="14" />
  </g>

  <!-- Central Super-Core Neural Node -->
  <circle cx="256" cy="256" r="54" fill="#ffffff" filter="url(#nodeGlow)" />
  <circle cx="256" cy="256" r="32" fill="url(#synapse3DGrad)" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" />
</svg>