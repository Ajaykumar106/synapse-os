<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="synapseGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="synapseGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a2387" />
      <stop offset="50%" stop-color="#e94057" />
      <stop offset="100%" stop-color="#f27121" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#synapseGrad1)" opacity="0.12" filter="url(#glow)" />

  <!-- Synaptic Axon Neural Pathways -->
  <g stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <!-- Outer Connecting Neural Arcs -->
    <path d="M140 256 C 140 170, 200 130, 256 130 C 312 130, 372 170, 372 256 C 372 342, 312 382, 256 382 C 200 382, 140 342, 140 256" 
          fill="none" stroke="url(#synapseGrad1)" stroke-width="8" stroke-dasharray="14 10" />

    <!-- Left to Center Synaptic Bridge -->
    <path d="M150 200 Q 210 240, 256 256" fill="none" stroke="url(#synapseGrad1)" stroke-width="10" />
    <path d="M150 312 Q 210 272, 256 256" fill="none" stroke="url(#synapseGrad1)" stroke-width="10" />

    <!-- Right to Center Synaptic Bridge -->
    <path d="M362 200 Q 302 240, 256 256" fill="none" stroke="url(#synapseGrad2)" stroke-width="10" />
    <path d="M362 312 Q 302 272, 256 256" fill="none" stroke="url(#synapseGrad2)" stroke-width="10" />

    <!-- Top & Bottom Vertical Axon Spikes -->
    <path d="M256 130 L 256 256" fill="none" stroke="#00f2fe" stroke-width="12" />
    <path d="M256 382 L 256 256" fill="none" stroke="#f27121" stroke-width="12" />
  </g>

  <!-- Synaptic Nodes (Neurons) -->
  <g filter="url(#glow)">
    <!-- Peripheral Nodes -->
    <circle cx="256" cy="130" r="18" fill="#00f2fe" />
    <circle cx="256" cy="382" r="18" fill="#f27121" />
    <circle cx="150" cy="200" r="16" fill="#4facfe" />
    <circle cx="150" cy="312" r="16" fill="#00f2fe" />
    <circle cx="362" cy="200" r="16" fill="#e94057" />
    <circle cx="362" cy="312" r="16" fill="#f27121" />

    <!-- Central High-Energy Synaptic Core -->
    <circle cx="256" cy="256" r="38" fill="url(#synapseGrad1)" />
    <circle cx="256" cy="256" r="24" fill="#ffffff" />
    <circle cx="256" cy="256" r="12" fill="#00f2fe" />
  </g>

  <!-- Spark Pulse Overlay -->
  <polygon points="256,220 264,248 292,256 264,264 256,292 248,264 220,256 248,248" fill="#ffffff" opacity="0.9" />
</svg>
