<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Ultra-Premium Vibrant Cyan to Deep Royal Blue Gradient -->
    <linearGradient id="synSquircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="25%" stop-color="#00c6ff" />
      <stop offset="65%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glass Specular Highlight for 3D Bevel -->
    <linearGradient id="synSpecular" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Radiant Synaptic Petal Gradient 1 (Cyan to Blue) -->
    <linearGradient id="synPetal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Radiant Synaptic Petal Gradient 2 (Blue to Violet) -->
    <linearGradient id="synPetal2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Core Sunburst Glow -->
    <radialGradient id="synCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Shadow for Squircle -->
    <filter id="synSquircleShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0066ff" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Neon Node Glow -->
    <filter id="synNeonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 3D Squircle Base with Deep Royal Luster -->
  <rect x="24" y="24" width="464" height="464" rx="118" fill="url(#synSquircleGrad)" filter="url(#synSquircleShadow)" />

  <!-- Inner 3D Glass Specular Lip -->
  <rect x="26" y="26" width="460" height="460" rx="116" fill="none" stroke="url(#synSpecular)" stroke-width="3.5" />

  <!-- Ambient Radial Core Glow behind central emblem -->
  <circle cx="256" cy="256" r="145" fill="url(#synCoreGlow)" />

  <!-- Concentric Precision Orbital Rings (Subtle Study OS Geometry) -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 12" opacity="0.35" />
  <circle cx="256" cy="256" r="105" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.45" />

  <!-- Dynamic Curved Synaptic Ribbons / Intertwined Neural Wings -->
  <!-- Top-Left Wing curving into core -->
  <path d="M 130,140 C 175,175 210,215 256,256 C 215,225 185,195 130,140 Z" fill="url(#synPetal1)" opacity="0.95" filter="url(#synNeonGlow)" />
  <path d="M 130,140 C 185,150 220,195 256,256" stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9" filter="url(#synNeonGlow)" />

  <!-- Top-Right Wing curving into core -->
  <path d="M 382,140 C 337,175 302,215 256,256 C 297,225 327,195 382,140 Z" fill="url(#synPetal2)" opacity="0.95" filter="url(#synNeonGlow)" />
  <path d="M 382,140 C 327,150 292,195 256,256" stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9" filter="url(#synNeonGlow)" />

  <!-- Bottom-Left Wing curving into core -->
  <path d="M 130,372 C 175,337 210,297 256,256 C 215,287 185,317 130,372 Z" fill="url(#synPetal2)" opacity="0.95" filter="url(#synNeonGlow)" />
  <path d="M 130,372 C 185,362 220,317 256,256" stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9" filter="url(#synNeonGlow)" />

  <!-- Bottom-Right Wing curving into core -->
  <path d="M 382,372 C 337,337 302,297 256,256 C 297,287 327,317 382,372 Z" fill="url(#synPetal1)" opacity="0.95" filter="url(#synNeonGlow)" />
  <path d="M 382,372 C 327,362 292,317 256,256" stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9" filter="url(#synNeonGlow)" />

  <!-- 4 Satellite Focus Nodes with Radiant Pulsing Rings -->
  <!-- Top Left Node -->
  <circle cx="130" cy="140" r="28" fill="#ffffff" filter="url(#synNeonGlow)" />
  <circle cx="130" cy="140" r="14" fill="#00f2fe" />
  <circle cx="130" cy="140" r="6" fill="#ffffff" />

  <!-- Top Right Node -->
  <circle cx="382" cy="140" r="28" fill="#ffffff" filter="url(#synNeonGlow)" />
  <circle cx="382" cy="140" r="14" fill="#818cf8" />
  <circle cx="382" cy="140" r="6" fill="#ffffff" />

  <!-- Bottom Left Node -->
  <circle cx="130" cy="372" r="28" fill="#ffffff" filter="url(#synNeonGlow)" />
  <circle cx="130" cy="372" r="14" fill="#818cf8" />
  <circle cx="130" cy="372" r="6" fill="#ffffff" />

  <!-- Bottom Right Node -->
  <circle cx="382" cy="372" r="28" fill="#ffffff" filter="url(#synNeonGlow)" />
  <circle cx="382" cy="372" r="14" fill="#00f2fe" />
  <circle cx="382" cy="372" r="6" fill="#ffffff" />

  <!-- Central Super-Nexus (The Synapse Spark) -->
  <circle cx="256" cy="256" r="48" fill="#ffffff" filter="url(#synNeonGlow)" />
  <circle cx="256" cy="256" r="32" fill="url(#synSquircleGrad)" />
  <circle cx="256" cy="256" r="16" fill="#ffffff" />
  <circle cx="256" cy="256" r="7" fill="#00f2fe" />
</svg>