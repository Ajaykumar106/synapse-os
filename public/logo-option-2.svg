<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Obsidian Night Base -->
    <linearGradient id="shieldBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="30%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Electric Amber-to-Cyan Energy Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="80%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Shield Ambient Glow -->
    <radialGradient id="shieldAura" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="shadowShield" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#f59e0b" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.4" />
    </filter>

    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 3D Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#shieldBaseGrad)" filter="url(#shadowShield)" />

  <!-- Outer Precision Border -->
  <rect x="26" y="26" width="460" height="460" rx="114" fill="none" stroke="url(#rimGlow)" stroke-width="3" />

  <!-- Inner Ambient Aura -->
  <rect x="30" y="30" width="452" height="452" rx="110" fill="url(#shieldAura)" />

  <!-- Focus Target Crosshair Rings (Subtle Geometric Discipline) -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="10 16" opacity="0.4" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 14" opacity="0.35" />

  <!-- 4 Tactical Focus Ticks -->
  <g stroke="#818cf8" stroke-width="3" opacity="0.6">
    <line x1="256" y1="70" x2="256" y2="86" />
    <line x1="256" y1="426" x2="256" y2="442" />
    <line x1="70" y1="256" x2="86" y2="256" />
    <line x1="426" y1="256" x2="442" y2="256" />
  </g>

  <!-- Geometric Discipline Shield Contour -->
  <path d="M256,108 L380,166 C380,274 328,348 256,396 C184,348 132,274 132,166 Z" 
        fill="none" 
        stroke="url(#rimGlow)" 
        stroke-width="5" 
        stroke-linejoin="round"
        opacity="0.85" />

  <!-- Central Sharp Synaptic Lightning Bolt -->
  <polygon points="274,124 188,264 250,264 238,388 334,236 266,236"
           fill="url(#boltGrad)"
           filter="url(#boltGlow)"
           stroke="#ffffff"
           stroke-width="2.5" />

  <!-- Inner Sparkle Node -->
  <circle cx="250" cy="264" r="8" fill="#ffffff" filter="url(#boltGlow)" />
</svg>