<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Cyber Velvet Background -->
    <linearGradient id="auroraBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b2b" />
      <stop offset="35%" stop-color="#0f0728" />
      <stop offset="75%" stop-color="#090518" />
      <stop offset="100%" stop-color="#04020a" />
    </linearGradient>

    <!-- Neon Aurora Core: Hot Magenta to Electric Cyan -->
    <linearGradient id="neonAurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="30%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glowing Specular Trim -->
    <linearGradient id="neonTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Radial Brain Glow -->
    <radialGradient id="auroraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="auroraShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#a855f7" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#06b6d4" flood-opacity="0.3" />
    </filter>

    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 3D Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#auroraBase)" filter="url(#auroraShadow)" />

  <!-- Inner Gloss Bevel -->
  <rect x="26" y="26" width="460" height="460" rx="114" fill="none" stroke="url(#neonTrim)" stroke-width="3" />

  <!-- Brain Core Radial Glow -->
  <circle cx="256" cy="256" r="150" fill="url(#auroraGlow)" />

  <!-- Left Hemisphere (Synaptic Neural Curves) -->
  <g fill="none" stroke="url(#neonAurora)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonBloom)">
    <!-- Outer Cortex Ridge Left -->
    <path d="M236,132 C184,132 144,168 144,220 C144,250 160,270 148,300 C136,330 156,368 196,376 C220,380 236,366 236,350" />
    <!-- Inner Gyri Arc Left 1 -->
    <path d="M236,176 C200,176 180,200 180,230 C180,260 216,268 216,296 C216,320 200,336 236,336" stroke-width="11" opacity="0.9" />
    <!-- Center Left Connector -->
    <path d="M236,220 C220,220 208,232 208,246 C208,260 236,266 236,276" stroke-width="9" opacity="0.8" />
  </g>

  <!-- Right Hemisphere (Synaptic Neural Curves) -->
  <g fill="none" stroke="url(#neonAurora)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonBloom)">
    <!-- Outer Cortex Ridge Right -->
    <path d="M276,132 C328,132 368,168 368,220 C368,250 352,270 364,300 C376,330 356,368 316,376 C292,380 276,366 276,350" />
    <!-- Inner Gyri Arc Right 1 -->
    <path d="M276,176 C312,176 332,200 332,230 C332,260 296,268 296,296 C296,320 312,336 276,336" stroke-width="11" opacity="0.9" />
    <!-- Center Right Connector -->
    <path d="M276,220 C292,220 304,232 304,246 C304,260 276,266 276,276" stroke-width="9" opacity="0.8" />
  </g>

  <!-- Central Synaptic Cleft Energy Spine (Sparks of Thought) -->
  <g stroke="#ffffff" stroke-width="4" filter="url(#neonBloom)">
    <line x1="256" y1="140" x2="256" y2="368" stroke-dasharray="10 12" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Luminous Synaptic Spark Nodes -->
  <g fill="#ffffff" filter="url(#neonBloom)">
    <circle cx="236" cy="132" r="9" />
    <circle cx="276" cy="132" r="9" />
    <circle cx="144" cy="220" r="10" fill="#ec4899" stroke="#ffffff" stroke-width="3" />
    <circle cx="368" cy="220" r="10" fill="#06b6d4" stroke="#ffffff" stroke-width="3" />
    <circle cx="196" cy="376" r="8" fill="#a855f7" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="316" cy="376" r="8" fill="#3b82f6" stroke="#ffffff" stroke-width="2.5" />
    <!-- Central Apex Synapse Orb -->
    <circle cx="256" cy="254" r="14" fill="#ffffff" />
    <circle cx="256" cy="254" r="7" fill="#a855f7" />
  </g>
</svg>