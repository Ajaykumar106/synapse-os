<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Radiant Synaptic Petal Gradient 1 (Cyan to Blue) -->
    <linearGradient id="embPetal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Radiant Synaptic Petal Gradient 2 (Blue to Violet) -->
    <linearGradient id="embPetal2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Central Super-Nexus Gradient -->
    <linearGradient id="embCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Core Sunburst Glow -->
    <radialGradient id="embCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="embNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Radial Core Glow -->
  <circle cx="256" cy="256" r="190" fill="url(#embCoreGlow)" />

  <!-- Concentric Precision Focus Rings -->
  <circle cx="256" cy="256" r="160" stroke="#00f2fe" stroke-width="2" stroke-dasharray="6 12" opacity="0.4" />
  <circle cx="256" cy="256" r="120" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.5" />

  <!-- Dynamic Curved Synaptic Ribbons / Intertwined Neural Wings -->
  <!-- Top-Left Wing curving into core -->
  <path d="M 120,130 C 175,170 210,215 256,256 C 215,225 180,190 120,130 Z" fill="url(#embPetal1)" opacity="0.95" filter="url(#embNeonGlow)" />
  <path d="M 120,130 C 180,140 215,190 256,256" stroke="#ffffff" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.95" filter="url(#embNeonGlow)" />

  <!-- Top-Right Wing curving into core -->
  <path d="M 392,130 C 337,170 302,215 256,256 C 297,225 332,190 392,130 Z" fill="url(#embPetal2)" opacity="0.95" filter="url(#embNeonGlow)" />
  <path d="M 392,130 C 332,140 297,190 256,256" stroke="#ffffff" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.95" filter="url(#embNeonGlow)" />

  <!-- Bottom-Left Wing curving into core -->
  <path d="M 120,382 C 175,342 210,297 256,256 C 215,287 180,322 120,382 Z" fill="url(#embPetal2)" opacity="0.95" filter="url(#embNeonGlow)" />
  <path d="M 120,382 C 180,372 215,322 256,256" stroke="#ffffff" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.95" filter="url(#embNeonGlow)" />

  <!-- Bottom-Right Wing curving into core -->
  <path d="M 392,382 C 337,342 302,297 256,256 C 297,287 332,322 392,382 Z" fill="url(#embPetal1)" opacity="0.95" filter="url(#embNeonGlow)" />
  <path d="M 392,382 C 332,372 297,322 256,256" stroke="#ffffff" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.95" filter="url(#embNeonGlow)" />

  <!-- 4 Satellite Focus Nodes with Radiant Pulsing Rings -->
  <!-- Top Left Node -->
  <circle cx="120" cy="130" r="32" fill="#ffffff" filter="url(#embNeonGlow)" />
  <circle cx="120" cy="130" r="16" fill="#00f2fe" />
  <circle cx="120" cy="130" r="7" fill="#ffffff" />

  <!-- Top Right Node -->
  <circle cx="392" cy="130" r="32" fill="#ffffff" filter="url(#embNeonGlow)" />
  <circle cx="392" cy="130" r="16" fill="#818cf8" />
  <circle cx="392" cy="130" r="7" fill="#ffffff" />

  <!-- Bottom Left Node -->
  <circle cx="120" cy="382" r="32" fill="#ffffff" filter="url(#embNeonGlow)" />
  <circle cx="120" cy="382" r="16" fill="#818cf8" />
  <circle cx="120" cy="382" r="7" fill="#ffffff" />

  <!-- Bottom Right Node -->
  <circle cx="392" cy="382" r="32" fill="#ffffff" filter="url(#embNeonGlow)" />
  <circle cx="392" cy="382" r="16" fill="#00f2fe" />
  <circle cx="392" cy="382" r="7" fill="#ffffff" />

  <!-- Central Super-Nexus (The Synapse Spark) -->
  <circle cx="256" cy="256" r="54" fill="#ffffff" filter="url(#embNeonGlow)" />
  <circle cx="256" cy="256" r="36" fill="url(#embCoreGrad)" />
  <circle cx="256" cy="256" r="18" fill="#ffffff" />
  <circle cx="256" cy="256" r="8" fill="#00f2fe" />
</svg>